<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HAMCO TRANS Driver</title>
  <link rel="manifest" href="manifest-driver.json">
  <meta name="theme-color" content="#1a3a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HT Driver">
  <link rel="apple-touch-icon" href="icon-driver-192.png">
  <style>
    body{margin:0;background:#1a3a5c;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column}
    .logo{width:80px;height:80px;background:#0d9e6e;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;margin-bottom:16px}
    p{color:rgba(255,255,255,.6);font-family:sans-serif;font-size:13px}
  </style>
</head>
<body>
  <div class="logo">DRV</div>
  <p>Memuat aplikasi driver...</p>
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw-driver.js');
    }
    window.location.replace('driver.html');
  </script>
</body>
</html>
